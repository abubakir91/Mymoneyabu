.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(118px,auto);gap:2px;padding:10px 6px;max-width:520px;margin:0 auto}

#md{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:5}

input{width:100%;padding:11px;margin:4px 0 10px;border:1px solid var(--ln);border-radius:10px;background:var(--top);color:var(--tx);font-size:16px}

.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--pr)}
.warn{background:#fff3cd;color:#5c4400;border-radius:10px;padding:8px 10px;margin:10px 12px;font-size:13px}

#lk{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}

.tkbg{background:linear-gradient(180deg,#dff5ea 0%,#e8f0ff 50%,#fde8f3 100%);min-height:calc(100vh - 230px);padding-bottom:30px}
